<canvas id="c"></canvas>
<style>canvas { width: 100%; height: 100%; display: block; }</style>
<script>
  // A light animation on a canvas: the kind of thing that should stay smooth.
  const c = document.getElementById("c"), g = c.getContext("2d");
  function size() { c.width = c.clientWidth; c.height = c.clientHeight; }
  size(); addEventListener("resize", size);
  const bodies = Array.from({ length: 5 }, (_, i) => ({ r: 22 + i * 16, a: i * 1.3, v: 0.03 - i * 0.004 }));
  let frames = 0, last = performance.now();
  function draw(now) {
    g.fillStyle = "rgba(5,4,0,0.18)"; g.fillRect(0, 0, c.width, c.height);
    const cx = c.width / 2, cy = c.height / 2;
    g.fillStyle = "#ffb000"; g.beginPath(); g.arc(cx, cy, 6, 0, 7); g.fill();
    for (const b of bodies) {
      b.a += b.v;
      g.beginPath(); g.arc(cx + Math.cos(b.a) * b.r * 1.5, cy + Math.sin(b.a) * b.r, 3, 0, 7); g.fill();
    }
    frames++;
    if (now - last >= 1000) { woody.report({ fps: Math.round((frames * 1000) / (now - last)) }); frames = 0; last = now; }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw); woody.ready();
</script>
