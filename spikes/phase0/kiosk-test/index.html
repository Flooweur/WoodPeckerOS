<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WoodPecker HUD render test</title>
<style>
  :root { --amber: #ffb000; --amber-dim: #7a5200; --red: #ff3b2f; --bg: #050403; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--amber);
    font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .panel { position: fixed; padding: 14px 18px; border: 1px solid var(--amber-dim);
    background: rgba(20, 12, 0, 0.55); backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(255, 176, 0, 0.25), inset 0 0 12px rgba(255, 176, 0, 0.08);
    text-shadow: 0 0 8px rgba(255, 176, 0, 0.7); font-size: 14px; line-height: 1.6; }
  #stats { top: 24px; left: 24px; min-width: 420px; }
  #verdict { bottom: 24px; left: 24px; font-size: 20px; }
  #title { top: 24px; right: 24px; font-size: 22px; letter-spacing: 0.3em; }
  .k { color: var(--amber-dim); text-shadow: none; }
  .bad { color: var(--red); text-shadow: 0 0 8px rgba(255, 59, 47, 0.8); }
  .scan { position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,0.18) 2px 3px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div>
<div class="panel" id="title">WOODPECKER · RENDER TEST</div>
<div class="panel" id="stats">
  <div><span class="k">fps (now / avg / 1% low)</span> <span id="fps">…</span></div>
  <div><span class="k">frame budget misses    </span> <span id="miss">…</span></div>
  <div><span class="k">viewport               </span> <span id="vp">…</span></div>
  <div><span class="k">webgl renderer         </span> <span id="gl">…</span></div>
  <div><span class="k">elapsed                </span> <span id="t">…</span></div>
</div>
<div class="panel" id="verdict">measuring…</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

function resize() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  $('vp').textContent = `${innerWidth}×${innerHeight} @${devicePixelRatio}x`;
}
addEventListener('resize', resize); resize();

// Which GPU is Chromium really using? "SVGA3D" = VMware 3D; "llvmpipe"/"SwiftShader" = software.
(function () {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (!gl) { $('gl').textContent = 'WebGL unavailable'; $('gl').className = 'bad'; return; }
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    $('gl').textContent = r;
    if (/llvmpipe|swiftshader|software/i.test(r)) $('gl').className = 'bad';
  } catch (e) { $('gl').textContent = String(e); }
})();

const meters = Array.from({ length: 4 }, (_, i) => ({ phase: i * 1.7, speed: 0.6 + i * 0.25 }));
const particles = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.08, s: 1 + Math.random() * 2 }));
const spark = new Array(160).fill(0.5);

function draw(ts) {
  const w = cv.width, h = cv.height, t = ts / 1000;
  ctx.clearRect(0, 0, w, h);

  // drifting particles
  ctx.fillStyle = 'rgba(255,176,0,0.35)';
  for (const p of particles) {
    p.y -= p.v * 0.01; if (p.y < 0) { p.y = 1; p.x = Math.random(); }
    ctx.fillRect(p.x * w, p.y * h, p.s, p.s);
  }

  // arc meters with glow (shadowBlur is the expensive part, on purpose)
  const r = Math.min(w, h) * 0.11, cy = h * 0.52;
  meters.forEach((m, i) => {
    const cx = w * (0.2 + i * 0.2);
    const val = 0.5 + 0.45 * Math.sin(t * m.speed + m.phase);
    ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
    ctx.shadowBlur = 0; ctx.strokeStyle = '#3a2800';
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
    ctx.shadowColor = val > 0.85 ? '#ff3b2f' : '#ffb000'; ctx.shadowBlur = 28;
    ctx.strokeStyle = val > 0.85 ? '#ff3b2f' : '#ffb000';
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * (0.75 + 1.5 * val)); ctx.stroke();
    // rotating tick ring
    ctx.shadowBlur = 8; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,176,0,0.5)';
    for (let k = 0; k < 36; k++) {
      const a = k / 36 * Math.PI * 2 + t * 0.4 * (i % 2 ? -1 : 1);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 1.25, cy + Math.sin(a) * r * 1.25);
      ctx.lineTo(cx + Math.cos(a) * r * 1.33, cy + Math.sin(a) * r * 1.33); ctx.stroke();
    }
    ctx.shadowBlur = 12; ctx.fillStyle = '#ffb000'; ctx.textAlign = 'center';
    ctx.font = `${r * 0.38}px "JetBrains Mono", monospace`;
    ctx.fillText(Math.round(val * 100) + '%', cx, cy + r * 0.13);
  });

  // scrolling sparkline
  spark.push(0.5 + 0.3 * Math.sin(t * 2.1) + 0.15 * Math.sin(t * 7.3)); spark.shift();
  ctx.shadowBlur = 16; ctx.shadowColor = '#ffb000'; ctx.strokeStyle = '#ffb000'; ctx.lineWidth = 2;
  ctx.beginPath();
  spark.forEach((v, i) => {
    const x = w * 0.1 + (w * 0.8) * i / (spark.length - 1), y = h * 0.86 - v * h * 0.1;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke(); ctx.shadowBlur = 0;
}

// frame timing
let last = performance.now(), start = last, frames = [], misses = 0;
function loop(ts) {
  const dt = ts - last; last = ts;
  if (dt > 0 && dt < 1000) { frames.push(dt); if (frames.length > 600) frames.shift(); if (dt > 25) misses++; }
  draw(ts);
  if (frames.length > 30 && Math.round(ts / 250) !== Math.round((ts - dt) / 250)) {
    const avg = frames.reduce((a, b) => a + b, 0) / frames.length;
    const sorted = [...frames].sort((a, b) => b - a);
    const low = sorted[Math.floor(sorted.length * 0.01)];
    const fAvg = 1000 / avg, fLow = 1000 / low;
    $('fps').textContent = `${(1000 / dt).toFixed(0)} / ${fAvg.toFixed(1)} / ${fLow.toFixed(1)}`;
    $('miss').textContent = `${misses} frames over 25 ms`;
    $('t').textContent = `${((ts - start) / 1000).toFixed(0)} s`;
    const v = $('verdict');
    if (fAvg >= 50 && fLow >= 30) { v.textContent = 'PASS · smooth enough for the animated HUD'; v.className = 'panel'; }
    else if (fAvg >= 28) { v.textContent = 'MARGINAL · usable with reduced glow/blur'; v.className = 'panel'; }
    else { v.textContent = 'FAIL · plan for a low-effects HUD or another display path'; v.className = 'panel bad'; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
