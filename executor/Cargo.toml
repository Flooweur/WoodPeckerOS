[package]
name = "woody-execd"
version = "0.1.0"
edition = "2021"
description = "WoodPecker-OS privileged executor: typed actions, scope enforcement, approvals, audit"
license = "MIT"

[lib]
name = "woody_exec"
path = "src/lib.rs"

[[bin]]
name = "woody-execd"
path = "src/main.rs"

[[bin]]
name = "woodyctl"
path = "src/bin/woodyctl.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ipnet = "2"
nix = { version = "0.29", features = ["socket", "user", "fs"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
